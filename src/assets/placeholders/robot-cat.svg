  <line x1="180" y1="135" x2="192" y2="135" stroke="#38bdf8" stroke-width="3" />
  <line x1="208" y1="135" x2="220" y2="135" stroke="#38bdf8" stroke-width="3" />
  <text x="200" y="270" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Futuristic Feline Companion</text>
