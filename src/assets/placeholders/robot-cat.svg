  <polygon points="140,110 160,60 185,100" fill="#3b82f6" />
  <polygon points="215,100 240,60 260,110" fill="#3b82f6" />
  <!-- Head -->
  <circle cx="200" cy="140" r="55" fill="#1e293b" stroke="#60a5fa" stroke-width="4" />
